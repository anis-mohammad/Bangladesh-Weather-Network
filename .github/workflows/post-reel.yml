name: Post Football Reel to Facebook

# Each run rotates across all football sources (src/feeds.py): prepare (clean headline,
# build the branded card + 3s video, stage it) then publish (caption + rotating
# hashtags + auto source comment). Dedup + rotation + hashtag cursors live in
# state.json and are committed back so they persist between scheduled runs.
#
# Configure in the repo:
#   Secrets:  FB_PAGE_ID, FB_PAGE_ACCESS_TOKEN

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Specific article URL (overrides rotation)"
        required: false
        default: ""
      rss:
        description: "Specific RSS feed (overrides rotation)"
        required: false
        default: ""
      no_post:
        description: "Generate assets only, do not publish"
        type: boolean
        default: false
  schedule:
    # Five times a day (UTC): 07:00, 11:00, 14:00, 17:00, 20:00 — spread across
    # UK/Europe + US football hours. cron is UTC; edit the times to taste.
    - cron: "0 7,11,14,17,20 * * *"

# contents: push the updated state.json back; issues: open a failure alert
permissions:
  contents: write
  issues: write

# never run two posts at once (would race on state.json)
concurrency:
  group: post-reel
  cancel-in-progress: false

jobs:
  post-reel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build and post Football Reel
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          INPUT_URL: ${{ github.event.inputs.url }}
          INPUT_RSS: ${{ github.event.inputs.rss }}
          NO_POST: ${{ github.event.inputs.no_post }}
        run: |
          set -e
          # 1) PREPARE: scrape + clean headline + build card/video + stage
          if [ -n "$INPUT_URL" ]; then
            python main.py --url "$INPUT_URL" --no-post
          elif [ -n "$INPUT_RSS" ]; then
            python main.py --rss "$INPUT_RSS" --no-post
          else
            python main.py --rotate
          fi
          # 2) PUBLISH the staged Reel (caption + hashtags + auto source comment)
          if [ "$NO_POST" = "true" ]; then
            echo "no_post=true → staged only, not publishing."
          else
            python main.py --publish
          fi

      - name: Commit updated rotation/hashtag state
        if: success()
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "chore: update reel rotation + hashtag state [skip ci]"
            git push
          else
            echo "No state change to commit."
          fi

      - name: Upload generated media
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reel-output
          path: |
            output/*.png
            output/*.mp4
          if-no-files-found: ignore
          retention-days: 7

      # On failure, open (or comment on an already-open) issue so you get a
      # GitHub email alert. Deduped: one open issue, commented on each new
      # failure — close it once fixed and the next failure opens a fresh one.
      - name: Alert on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = [
              'The scheduled Facebook Reel job **failed**.',
              '',
              `- Run log: ${runUrl}`,
              `- Run number: #${context.runNumber}`,
              '',
              'Likely causes: Facebook token invalidated, a news feed offline, ' +
              'or a build/dependency error. Open the run log above for details.',
            ].join('\n');
            const open = await github.rest.issues.listForRepo(
              { owner, repo, state: 'open', labels: 'reel-failure' });
            if (open.data.length) {
              await github.rest.issues.createComment(
                { owner, repo, issue_number: open.data[0].number, body });
            } else {
              await github.rest.issues.create(
                { owner, repo, title: '⚠️ Football Reel posting is failing',
                  body, labels: ['reel-failure'] });
            }
