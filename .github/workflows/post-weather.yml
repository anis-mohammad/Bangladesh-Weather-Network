name: Post Bangladesh Weather Reel to Facebook

# Each run fetches current + today's min/max temperatures for all 8 divisions
# from Meteosource, builds a Bangla weather card + short video, then publishes it
# as a Facebook Reel. The hashtag-rotation cursor lives in state.json and is
# committed back so it advances between scheduled runs.
#
# Configure in the repo:
#   Secrets:  METEOSOURCE_API_KEY, FB_PAGE_ID, FB_PAGE_ACCESS_TOKEN

on:
  workflow_dispatch:
    inputs:
      no_post:
        description: "Generate assets only, do not publish"
        type: boolean
        default: false
  schedule:
    # Four times a day at 10:00, 12:00, 18:00 and 22:00 Bangladesh time
    # (Asia/Dhaka = UTC+6). cron is UTC, so subtract 6 hours.
    #   10:00 BST -> 04:00 UTC | 12:00 -> 06:00 | 18:00 -> 12:00 | 22:00 -> 16:00
    - cron: "0 4,6,12,16 * * *"

# contents: push the updated state.json back; issues: open a failure alert
permissions:
  contents: write
  issues: write

# never run two posts at once (would race on state.json)
concurrency:
  group: post-weather
  cancel-in-progress: false

jobs:
  post-weather:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify Bangla text shaping (raqm) is available
        run: python -c "from PIL import features; assert features.check('raqm'), 'Pillow built without raqm — Bangla will render incorrectly'"

      - name: Build and post Weather Reel
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          METEOSOURCE_API_KEY: ${{ secrets.METEOSOURCE_API_KEY }}
          NO_POST: ${{ github.event.inputs.no_post }}
        run: |
          set -e
          # 1) BUILD: fetch weather + render card/video + stage it
          python main.py --no-post
          # 2) PUBLISH the staged Reel (caption + rotating hashtags)
          if [ "$NO_POST" = "true" ]; then
            echo "no_post=true → staged only, not publishing."
          else
            python main.py --publish
          fi

      - name: Commit updated hashtag state
        if: success()
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "chore: advance weather hashtag rotation [skip ci]"
            git push
          else
            echo "No state change to commit."
          fi

      - name: Upload generated media
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weather-output
          path: |
            output/*.png
            output/*.mp4
          if-no-files-found: ignore
          retention-days: 7

      # On failure, open (or comment on an already-open) issue so you get a
      # GitHub email alert. Deduped: one open issue, commented on each new
      # failure — close it once fixed and the next failure opens a fresh one.
      - name: Alert on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = [
              'The scheduled Bangladesh Weather Reel job **failed**.',
              '',
              `- Run log: ${runUrl}`,
              `- Run number: #${context.runNumber}`,
              '',
              'Likely causes: Facebook token invalidated, Meteosource key/quota or outage, ' +
              'or a build/dependency error. Open the run log above for details.',
            ].join('\n');
            const open = await github.rest.issues.listForRepo(
              { owner, repo, state: 'open', labels: 'weather-failure' });
            if (open.data.length) {
              await github.rest.issues.createComment(
                { owner, repo, issue_number: open.data[0].number, body });
            } else {
              await github.rest.issues.create(
                { owner, repo, title: '⚠️ Bangladesh Weather Reel posting is failing',
                  body, labels: ['weather-failure'] });
            }
